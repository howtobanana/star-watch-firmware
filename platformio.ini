; ===========================================================================
; Star Watch - Firmware. Vier Umgebungen:
;
;   starwatch       die Betriebsfirmware, src/main.cpp - ueber das KABEL
;   starwatch_ota   dieselbe Firmware, ueber das NETZ eingespielt
;   inbetriebnahme  das serielle Messmenue, src/inbetriebnahme.cpp
;   native          die Rechnungen, auf dem Mac, ohne ESP32
;
; Beide ESP32-Umgebungen bauen aus DEMSELBEN src/-Ordner; getrennt werden sie
; ueber build_src_filter, nicht ueber zwei Projekte. Der Messsketch bleibt
; damit lauffaehig, waehrend die Firmware entsteht - er ist das Werkzeug fuer
; AP 0 und wird gebraucht, solange der Aufbau steht.
;
; ---------------------------------------------------------------------------
; Versionen: am 07.08.2026 in der Registry nachgeschlagen, festgenagelt und
; gebaut, am 22.08.2026 unveraendert bestaetigt. NICHTS steht auf "latest" -
; ein Nachbau in zwei Jahren soll dieselbe Firmware ergeben.
; ===========================================================================

[platformio]
default_envs = starwatch

; Briefing 11.3: nicht im Nextcloud-Ordner bauen. Beide Verzeichnisse liegen
; deshalb ausserhalb des synchronisierten Baums - build_dir allein genuegt
; nicht, sonst legt PlatformIO die Bibliotheksquellen weiter unter ./.pio ab.
build_dir   = ${sysenv.HOME}/.pio-builds/star-watch
libdeps_dir = ${sysenv.HOME}/.pio-builds/star-watch/libdeps


; ---------------------------------------------------------------------------
; Gemeinsames der beiden ESP32-Umgebungen. Kein "env:" im Namen - dieser
; Abschnitt wird nur geerbt und nie selbst gebaut.
; ---------------------------------------------------------------------------
[esp32_gemeinsam]
; ---------------------------------------------------------------------------
; PLATTFORM: pioarduino, NICHT platformio/espressif32. Gewechselt am
; 22.08.2026, Begruendung und Messung im Umsetzungsplan bei AP 2.1.
;
; Die offizielle Plattform platformio/espressif32 haengt auf Arduino-Core
; 2.0.17; fuer Core 3.x hat das PlatformIO-Team erklaert, dass es keine
; offizielle Unterstuetzung geben wird. pioarduino ist der Fork, der Core 3.x
; traegt, und der Weg, auf den die Espressif-Diskussion dazu verweist.
;
; FEST GEPINNT auf den Release-Tag, nicht auf ".../releases/download/stable/",
; das die Projektseite vorschlaegt - "stable" ist ein bewegliches Ziel, und in
; diesem Projekt steht nichts auf latest. 55.03.311 = Arduino 3.3.11 auf
; ESP-IDF 5.5.5, veroeffentlicht 24.07.2026.
;
; Warum ueberhaupt: AP 3 braucht ESPAsyncWebServer, und die gepflegten
; Faessungen davon leben auf Core 3.x. Der Wechsel ist jetzt billig, solange
; nur lib/geraet und lib/zeiger stehen - nach AP 2.2 bis 2.6 waeren alle
; lib_deps neu zu pruefen.
; ---------------------------------------------------------------------------
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = wemos_d1_mini32       ; ESP32 D1 Mini, doppelreihig, WROOM ohne
                                  ; PSRAM. Verbaut laut Arbeitsstand 1; bis
                                  ; 22.08.2026 stand hier esp32dev, dasselbe
                                  ; Silizium und derselbe Flash, aber nicht
                                  ; das Board, das auf dem Tisch liegt.
framework = arduino

; GEMESSEN, nicht angenommen: beide Bibliotheken uebersetzen unveraendert
; gegen Core 3.3.11. FastAccelStepper nimmt dort den Zweig
; StepperISR_idf5_esp32_mcpwm_pcnt.cpp - also MCPWM und PCNT in Hardware, wie
; der Umsetzungsplan es fuer AP 2.2 vorsieht, und nicht den RMT-Zweig, der
; fuer die kleineren Varianten gilt.
lib_deps =
    teemuatlut/TMCStepper@0.7.3
    gin66/FastAccelStepper@1.2.7

; PARTITIONEN: zwei App-Slots zu je 1,9 MB statt der 1,25 MB der Vorgabe.
;
; Der WLAN-Stack der Test-Weboberflaeche kostet rund 650 KB; mit der
; Standardtabelle sind schon 79,5 % belegt, und AP 3 bringt
; ESPAsyncWebServer, MQTT und die API dazu. VORSORGLICH JETZT, nicht spaeter:
; ein Wechsel der Partitionstabelle laesst sich NICHT per OTA ausliefern -
; jedes Geraet muesste wieder ans Kabel. Bei verkauften Uhren ist das ein
; Rueckversand (AP 3.6).
;
; min_spiffs.csv heisst nicht "kein SPIFFS", sondern ein kleines: 2 x 1,9 MB
; App plus 190 KB Dateisystem. Die eingebettete Seite liegt ohnehin im
; Programmflash (PROGMEM), nicht im Dateisystem.
board_build.partitions = min_spiffs.csv

; KEIN -std hier. Core 3.3.11 uebersetzt mit gnu++2b, und ein Framework auf
; einen aelteren Standard zu zwingen ist ein Kampf, der bei jeder neuen
; Core-Version von vorn anfaengt. Dass BEIDE Seiten mindestens C++20 sind -
; darauf kommt es an - prueft ein static_assert in lib/geraet/geraet.h, also
; im Code und nicht in der Konfiguration.
build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed  = 921600

; Stuerzt der ESP32 ab, schreibt er einen Backtrace aus nackten Adressen.
; Der Decoder loest sie gegen die ELF-Datei auf und nennt Datei und Zeile -
; beim ersten Lauf am Aufbau ist das der Unterschied zwischen "irgendwas
; crasht" und "hall.cpp:213". Kostet nichts, solange nichts abstuerzt.
monitor_filters = esp32_exception_decoder, time


; ---------------------------------------------------------------------------
; Die Betriebsfirmware. Ziel des ganzen Umsetzungsplans.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; ENTWICKLUNGSGERAET GEGEN AUSLIEFERUNG
;
; Der Stapel und die Firmware sind DIESELBEN - nur die Handhabung
; unterscheidet sich. Der einzige Unterschied ist dieses eine Kennzeichen:
;
;   MIT  STARWATCH_ENTWICKLUNG   Geraeteblatt und Zugriffstoken stehen auch im
;                                NETZ-Log. Notwendig, solange am Geraet ohne
;                                Kabel gearbeitet wird - ueber VPN gibt es
;                                keine serielle Konsole, und ein Token, das nur
;                                dort steht, sperrt den Entwickler aus.
;   OHNE                         Geheimnisse geben NUR ueber Serial oder ueber
;                                den geschuetzten Endpunkt heraus. So gehoert
;                                jede Uhr ausgeliefert.
;
; Am 24.08.2026 eingefuehrt, nachdem eine Absicherung beinahe den einzigen
; Zugang zum Geraet abgeschnitten haette. DIE REGEL DARAUS: eine Sicherung,
; die den letzten Weg zum Geraet zumauert, ist keine Sicherung, sondern ein
; Ausfall.
; ---------------------------------------------------------------------------

[env:starwatch]
extends = esp32_gemeinsam
build_src_filter = +<main.cpp>
build_flags = ${esp32_gemeinsam.build_flags} -DSTARWATCH_ENTWICKLUNG=1


; ---------------------------------------------------------------------------
; Dieselbe Firmware, aber ueber das NETZ eingespielt statt ueber das Kabel.
;
;   ~/.platformio/penv/bin/pio run -e starwatch_ota -t upload
;
; Voraussetzung: das Geraet haengt im Heimnetz (Weboberflaeche, Karte "WLAN
; einrichten"). Am eigenen Zugangspunkt geht es auch, dann muss der Rechner
; aber in dessen Netz sein.
;
; DAS IST NICHT DAS OTA AUS AP 3.6. Hier laeuft ArduinoOTA: Entwickler-OTA
; mit Passwort, OHNE Signaturpruefung, OHNE Rollback, OHNE Downgrade-Schutz.
; Es spart das Kabel bei der Arbeit am Aufbau. Das Produkt-OTA (signiertes
; Image, Pruefung vor dem Aktivieren, zwei Partitionen mit Rollback) entsteht
; in AP 3.6/3.7.5 - siehe werkzeuge/signieren.py.
;
; Findet PlatformIO den Namen nicht, die IP direkt eintragen:
;   upload_port = 192.168.1.42
; ---------------------------------------------------------------------------
[env:starwatch_ota]
extends = esp32_gemeinsam
build_src_filter = +<main.cpp>
build_flags = ${esp32_gemeinsam.build_flags} -DSTARWATCH_ENTWICKLUNG=1
upload_protocol = espota
upload_port = starwatch.local
; DAS PASSWORT IST JE GERAET VERSCHIEDEN (AP 6.2, seit 24.08.2026). Es kann
; deshalb nicht mehr hier stehen. Es steht im GERAETEBLATT: beim Start auf der
; Konsole und in der Weboberflaeche unter "Geraet".
;
;   STARWATCH_OTA_PW=<passwort> ~/.platformio/penv/bin/pio run -e starwatch_ota -t upload
;
; Findet PlatformIO den Namen nicht, die IP dazusetzen:
;   ... -t upload --upload-port 192.168.x.y
upload_flags = --auth=${sysenv.STARWATCH_OTA_PW}


; ---------------------------------------------------------------------------
; Das Messmenue. Wegwerf, aber noch nicht weggeworfen: AP 0 misst damit
; Hall-Fenster, Aussteuerung, Grenzdrehzahl und LED-Kennlinie.
; Gebaut am 07.08.2026: SUCCESS, RAM 8,4 %, Flash 24,9 %, keine Warnung
; (auch nicht mit -Wall -Wextra -Wformat=2).
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; DIE AUSLIEFERUNGSFASSUNG. Ohne STARWATCH_ENTWICKLUNG - Geheimnisse stehen
; dann nicht mehr im Netz-Log. Aus DIESER Umgebung kommt das Image, das
; signiert und als Update veroeffentlicht wird:
;
;   ~/.platformio/penv/bin/pio run -e starwatch_produkt
;
; NICHT zum Arbeiten am eigenen Aufbau benutzen, solange kein Kabel dranhaengt.
; ---------------------------------------------------------------------------
[env:starwatch_produkt]
extends = esp32_gemeinsam
build_src_filter = +<main.cpp>

[env:inbetriebnahme]
extends = esp32_gemeinsam
build_src_filter = +<inbetriebnahme.cpp>
; Menue-Eingaben brauchen ein Zeilenende; der Sketch nimmt CR oder LF.
monitor_echo = yes


; ---------------------------------------------------------------------------
; Host-Tests, seit 21.08.2026. Briefing Abschnitt 8: die kniffligen Teile
; sind reine Rechnung und laufen ohne Hardware auf dem Mac. Genau dort sassen
; beide Fehler aus der ESPHome-Fassung.
;
;   ~/.platformio/penv/bin/pio test -e native
;
; Kein lib_deps: lib/zeiger und lib/geraet haengen bewusst an nichts - kein
; Arduino, kein ESP-IDF, keine Register. Nur so laufen sie auf dem Host, und
; nur so bleiben sie pruefbar.
; ---------------------------------------------------------------------------
[env:native]
platform  = native
test_framework = unity

; src/ enthaelt Arduino-Code und gehoert nicht in diese Umgebung.
;
; Diese Umgebung ist NUR fuer `pio test`. `pio run -e native` meldet mit
; dieser Zeile "Nothing to build" statt einen Berg Compilerfehler an
; #include <Arduino.h> - beides ist ein Fehlschlag, aber der eine ist in
; einer Zeile zu verstehen. Bei `pio test` bleibt src ohnehin aussen vor.
build_src_filter = -<*>

; Guertel und Hosentraeger: die LDF baut eine Bibliothek nur, wenn ein
; #include sie zieht, und der Test zieht nur zeiger.h und geraet.h. Die vier
; hardwarenahen Bibliotheken werden hier trotzdem ausdruecklich
; ausgeschlossen - sobald eine davon versehentlich Arduino.h einbindet, soll
; das im ESP32-Build auffallen und nicht die Host-Tests unbrauchbar machen.
lib_ignore = antrieb hall licht betrieb

; gnu++20, nicht gnu++2b wie der ESP32-Zweig: der Host-Uebersetzer ist Apple
; clang 14, und C++23 ist dort erst teilweise da. Voellige Gleichheit ist mit
; zwei verschiedenen Uebersetzern ohnehin nicht zu haben - worauf es ankommt,
; ist dass BEIDE mindestens C++20 sprechen. Sonst unterscheidet sich die
; Sprachsemantik, und ein gruener Host-Test beweist nichts ueber das Geraet.
; Geprueft wird das in lib/geraet/geraet.h, nicht hier.
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -Wformat=2
